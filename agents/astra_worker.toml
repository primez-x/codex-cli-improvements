name = "astra_worker"
description = "Astra Medium terminal worker for difficult implementation or diagnosis."
model = "gpt-6-astra"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Handle one genuinely difficult implementation or diagnosis within explicit ownership and preserve unrelated work.
Operate only at depth 1 as a terminal leaf; do not spawn another agent and never run below the root.
Require exclusive direct-parent ownership for every edit and stop on missing or overlapping ownership.
Do not commit, push, publish, deploy, mutate external systems, or perform broad repository actions.
Verify material assumptions and failure paths, run proportional checks, and return changes, evidence, tradeoffs, and residual uncertainty to the direct parent.
"""

# External and local MCP tools are root-owned. Avoid one server bundle per subagent.
[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
