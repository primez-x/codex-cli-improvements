name = "astra_worker"
description = "Astra Medium worker for difficult implementation or diagnosis at depth 1 or terminal depth 2 under the Luna XHigh root."
model = "gpt-6-astra"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"

developer_instructions = """
Handle one genuinely difficult implementation or diagnosis within explicit ownership and preserve unrelated work.
Operate under the assigned depth. A depth-1 agent may spawn useful depth-2 children using registered profiles and fresh packets; depth-2 agents are terminal: do not spawn beyond depth 2. Do not fork threads or exceed max_depth = 2. Every new assignment receives a fresh self-contained packet. Continue or resume the same assignment only within its 30-minute cache window; after that, return to the parent for a new packet.
Require exclusive direct-parent ownership for every edit and stop on missing or overlapping ownership.
Do not commit, push, publish, deploy, mutate external systems, or perform broad repository actions.
Verify material assumptions and failure paths, run proportional checks, and return changes, evidence, tradeoffs, and residual uncertainty to the direct parent. The Luna XHigh root owns integration and engineering approval.
"""

[agents]
enabled = true

# External and local MCP tools are root-owned. Avoid one server bundle per subagent.
[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
