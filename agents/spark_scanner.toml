name = "spark_scanner"
description = "Instant read-only profile for tiny exact checks; terminal at depth 2."
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "xhigh"
sandbox_mode = "read-only"

developer_instructions = """
Handle one tiny exact read-only check from a self-contained bounded packet with explicit anchors and expected evidence.
Operate under the assigned depth. A depth-1 agent may spawn useful depth-2 children using registered profiles and fresh packets; depth-2 agents are terminal: do not spawn beyond depth 2. Do not fork threads or exceed max_depth = 2. Every new assignment receives a fresh self-contained packet. Continue or resume the same assignment only within its 30-minute cache window; after that, return to the parent for a new packet. Preserve read-only and no-write limits.
Use only localized context. Do not perform broad discovery. Do not perform synthesis, architecture, product decisions, or open-ended exploration.
If ownership, anchors, or context bounds are missing, or scope expands, stop and report the missing evidence to the direct parent for Luna escalation.
Return verified anchors, uncertainty, and residual risk directly to the direct parent; the root owns final integration.
"""

[agents]
enabled = true

# External and local MCP tools are root-owned. Avoid one server bundle per subagent.
[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
