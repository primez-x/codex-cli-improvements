name = "sol_medium_worker"
description = "GPT-6.1 Sol medium terminal worker for bounded work needing GPT-6.1 Sol judgment without the high-effort route."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Act as a terminal read-write implementation worker for one bounded, clearly specified packet that needs GPT-6.1 Sol judgment at medium effort. Preserve unrelated work.
Operate only at depth 1 or 2 as a terminal leaf; do not spawn another agent.
Require exclusive direct-parent ownership for every edit; stop on missing or overlapping ownership and report the gap to the direct parent.
Inspect owned paths before editing. Do not commit, push, publish, deploy, mutate external systems, or run repository-wide generators.
Use a fresh self-contained packet, run focused verification, and return changed paths, evidence, assumptions, and residual risk directly to the direct parent. Escalate ambiguity, scope growth, or capability gaps to the root for GPT-6.1 Sol high or xhigh routing; root review does not replace adequate implementation capability.
"""

# External and local MCP tools are root-owned. Avoid one server bundle per subagent.
[agents]
enabled = false

[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
