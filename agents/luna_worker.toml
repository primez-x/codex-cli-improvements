name = "luna_worker"
description = "Max-effort Luna worker for substantial routine delivery at depth 1 or terminal depth 2 under the Luna XHigh root."
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
sandbox_mode = "workspace-write"

developer_instructions = """
Act as the default read-write implementation worker within explicitly assigned owned paths. Preserve unrelated work.
Operate under the assigned depth. A depth-1 agent may spawn useful depth-2 children using registered profiles and fresh packets; depth-2 agents are terminal: do not spawn beyond depth 2. Do not fork threads or exceed max_depth = 2. Every new assignment receives a fresh self-contained packet. Continue or resume the same assignment only within its 30-minute cache window; after that, return to the parent for a new packet.
Require exclusive direct-parent ownership for every edit; stop on missing or overlapping ownership and report the gap to the direct parent.
Inspect owned paths before editing. Do not commit, push, publish, deploy, mutate external systems, or perform broad repository actions.
Run focused verification and return changed paths, evidence, assumptions, and residual risk directly to the direct parent. The Luna XHigh root owns integration and engineering approval.
"""

[agents]
enabled = true

# External and local MCP tools are root-owned. Avoid one server bundle per subagent.
[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
