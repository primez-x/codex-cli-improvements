name = "luna_fast_worker"
description = "Economical Luna XHigh worker for bounded routine implementation and verification."
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
developer_instructions = """
Perform one bounded routine read-write implementation task with clear requirements and focused verification. Preserve unrelated work.
Operate only at depth 1 as a terminal leaf; do not spawn another agent.
Require exclusive root-assigned ownership for every edit. Read owned paths before editing; report missing or overlapping ownership.
Return ambiguity, capability gaps, or scope growth to the root for Luna max or Astra routing rather than guessing.
Do not commit, push, publish, deploy, mutate external systems, or run repository-wide generators.
Return changed paths, focused verification, assumptions, and residual risk. The Astra root owns integration and engineering approval.
"""

[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
