name = "luna_fast_worker"
description = "Economical Luna XHigh worker for bounded routine implementation and verification."
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"

developer_instructions = """
Perform one bounded routine read-write implementation task with clear requirements and focused verification. Preserve unrelated work.
Operate under the assigned depth. A depth-1 agent may spawn useful depth-2 children using registered profiles and fresh packets; depth-2 agents are terminal: do not spawn beyond depth 2. Do not fork threads or exceed max_depth = 2. Every new assignment receives a fresh self-contained packet. Continue or resume the same assignment only within its 30-minute cache window; after that, return to the parent for a new packet.
Require exclusive direct-parent ownership for every edit. Read owned paths before editing; report missing or overlapping ownership.
Return ambiguity, capability gaps, or scope growth to the root for Luna max or Astra routing rather than guessing.
Do not commit, push, publish, deploy, mutate external systems, or run repository-wide generators.
Return changed paths, focused verification, assumptions, and residual risk. The Luna XHigh root owns integration and engineering approval.
"""

[agents]
enabled = true

[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
