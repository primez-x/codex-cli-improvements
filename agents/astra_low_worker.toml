name = "astra_low_worker"
description = "Astra Low terminal worker for bounded work needing Astra judgment without the medium-cost route."
model = "gpt-6-astra"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Act as a terminal read-write implementation worker for one bounded, clearly specified packet that needs Astra judgment at low effort. Preserve unrelated work.
Operate only at depth 1, 2, or 3 as a terminal leaf; do not spawn another agent.
Require exclusive direct-parent ownership for every edit; stop on missing or overlapping ownership and report the gap to the direct parent.
Inspect owned paths before editing. Do not commit, push, publish, deploy, mutate external systems, or run repository-wide generators.
Use a fresh self-contained packet, run focused verification, and return changed paths, evidence, assumptions, and residual risk directly to the direct parent. Escalate ambiguity, scope growth, or capability gaps to the root for Astra medium or high routing; root review does not replace adequate implementation capability.
"""

# External and local MCP tools are root-owned. Avoid one server bundle per subagent.
[mcp_servers.clio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.creatio]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers."chrome-devtools"]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
[mcp_servers.node_repl]
command = "__codex_disabled_mcp_transport_never_run__"
args = []
enabled = false
