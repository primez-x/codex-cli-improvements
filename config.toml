model = "gpt-5.6-sol"
model_reasoning_effort = "low"

[agents]
max_concurrent_threads_per_session = 4
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[agents.spark_scanner]
description = "Instant terminal read-only leaf for tiny exact checks from bounded self-contained packets."
config_file = "./agents/spark_scanner.toml"

[agents.spark_worker]
description = "Instant terminal writer for small mechanical edits with focused verification."
config_file = "./agents/spark_worker.toml"

[agents.luna_scanner]
description = "Medium-effort read-only leaf for broad discovery and context-heavy evidence work."
config_file = "./agents/luna_scanner.toml"

[agents.luna_worker]
description = "Max-effort default implementation leaf for substantial routine delivery work."
config_file = "./agents/luna_worker.toml"

[agents.sol_worker]
description = "Deep terminal implementation or diagnosis agent for a genuinely difficult, ambiguous, security-sensitive, or cross-layer depth-1 task that justifies Sol xhigh."
config_file = "./agents/sol_worker.toml"

[agents.sol_advisor]
description = "Max-effort terminal adversarial advisor for rare consequential architecture, plans, decisions, or diffs."
config_file = "./agents/sol_advisor.toml"

[agents.sol_reviewer]
description = "Gate-only terminal Sol reviewer that returns only a strict evidence-bound ReviewOutputV1 object."
config_file = "./agents/sol_reviewer.toml"

[features]
multi_agent = true

[[skills.config]]
path = "./skills/plan-review-ladder/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/delivery-orchestration/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/instruction-learning-loop/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/adversarial-code-review/SKILL.md"
enabled = true
