model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 2
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "medium"

[agents.spark_scanner]
description = "Instant read-only profile for tiny exact checks; terminal at depth 2."
config_file = "./agents/spark_scanner.toml"

[agents.spark_worker]
description = "Instant writer for small mechanical edits with focused verification; terminal at depth 2."
config_file = "./agents/spark_worker.toml"

[agents.luna_scanner]
description = "Medium-effort read-only profile for broad discovery and context-heavy evidence; terminal at depth 2."
config_file = "./agents/luna_scanner.toml"

[agents.luna_worker]
description = "Luna max worker for substantial delivery at depth 1 or terminal depth 2 under the Luna XHigh root."
config_file = "./agents/luna_worker.toml"

[agents.luna_fast_worker]
description = "Economical Luna xhigh worker for bounded routine implementation and verification."
config_file = "./agents/luna_fast_worker.toml"

[agents.sol_fast_worker]
description = "Sol low worker for simpler, tightly specified, low-ambiguity critical-path work."
config_file = "./agents/sol_fast_worker.toml"

[agents.astra_worker]
description = "Astra medium worker for difficult implementation or diagnosis at depth 1 or terminal depth 2 under the Luna XHigh root."
config_file = "./agents/astra_worker.toml"

[agents.astra_low_worker]
description = "Astra low profile for bounded implementation needing more judgment than smaller models; terminal at depth 2."
config_file = "./agents/astra_low_worker.toml"

[agents.astra_advisor]
description = "Astra high read-only critic for consequential approaches and integrated deliveries."
config_file = "./agents/astra_advisor.toml"

[features]
multi_agent = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 1500000
default_wait_timeout_ms = 1500000
max_wait_timeout_ms = 1500000

[[skills.config]]
path = "./skills/delivery-orchestration/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/instruction-learning-loop/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/adversarial-code-review/SKILL.md"
enabled = true

[plugins."superpowers@openai-curated-remote"]
enabled = false
