model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
max_concurrent_threads_per_session = 8
max_depth = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"

[agents.spark_scanner]
description = "Fastest terminal read-only agent for small, gated evidence checks; preferred Spark leaf at any depth."
config_file = "./agents/spark_scanner.toml"

[agents.spark_worker]
description = "Fast terminal implementation agent for small, gated localized changes at any allowed depth."
config_file = "./agents/spark_worker.toml"

[agents.luna_scanner]
description = "Low-cost terminal read-only agent for bounded evidence work at depths 1-3."
config_file = "./agents/luna_scanner.toml"

[agents.luna_worker]
description = "Low-cost terminal implementation agent for bounded routine work at depths 1-3."
config_file = "./agents/luna_worker.toml"

[agents.luna_coordinator]
description = "Low-cost coordinator for bounded workstreams at depths 1-2; routes terminal leaves without Spark coordination."
config_file = "./agents/luna_coordinator.toml"

[agents.terra_worker]
description = "Balanced terminal implementation agent for normal multi-file work, debugging, tests, or documentation at depths 1 or 2 when Spark or Luna would be too narrow."
config_file = "./agents/terra_worker.toml"

[agents.terra_coordinator]
description = "Balanced coordinator for bounded multi-part workstreams at depths 1-2; routes terminal leaves without Spark coordination."
config_file = "./agents/terra_coordinator.toml"

[agents.sol_worker]
description = "Deep terminal implementation or diagnosis agent for a genuinely difficult, ambiguous, security-sensitive, or cross-layer depth-1 task that justifies Sol xhigh."
config_file = "./agents/sol_worker.toml"

[agents.sol_advisor]
description = "Max-effort terminal depth-1 adversarial advisor for consequential architecture, plans, decisions, or diffs without a Sol-led subtree."
config_file = "./agents/sol_advisor.toml"

[agents.sol_reviewer]
description = "Terminal Sol reviewer that returns only a strict evidence-bound review JSON receipt."
config_file = "./agents/sol_reviewer.toml"

[agents.sol_coordinator]
description = "Max-effort depth-1 Sol supervisor for architecture, adversarial review, and complex bounded workstreams."
config_file = "./agents/sol_coordinator.toml"

[features]
multi_agent = true

[[skills.config]]
path = "./skills/plan-review-ladder/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/delivery-orchestration/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/instruction-learning-loop/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/adversarial-code-review/SKILL.md"
enabled = true
