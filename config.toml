model = "gpt-5.6-luna"
model_reasoning_effort = "max"

[agents]
max_concurrent_threads_per_session = 64
max_depth = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.spark_scanner]
description = "Instant terminal read-only leaf for tiny exact checks from bounded self-contained packets."
config_file = "./agents/spark_scanner.toml"

[agents.spark_worker]
description = "Instant terminal writer for small mechanical edits with focused verification."
config_file = "./agents/spark_worker.toml"

[agents.luna_scanner]
description = "Low-effort read-only leaf for broad discovery and context-heavy evidence work."
config_file = "./agents/luna_scanner.toml"

[agents.luna_worker]
description = "Medium-effort default implementation worker for routine delivery or bounded sub-orchestration."
config_file = "./agents/luna_worker.toml"

[agents.luna_orchestrator]
description = "Max-effort bounded multi-area orchestrator for coordinated depth-2 delivery."
config_file = "./agents/luna_orchestrator.toml"

[agents.sol_worker]
description = "Deep terminal implementation or diagnosis agent for a genuinely difficult, ambiguous, security-sensitive, or cross-layer depth-1 task that justifies Sol high."
config_file = "./agents/sol_worker.toml"

[agents.sol_advisor]
description = "High-effort terminal adversarial advisor for rare consequential architecture, plans, decisions, or diffs."
config_file = "./agents/sol_advisor.toml"

[agents.sol_reviewer]
description = "On-demand read-only Sol reviewer for root-prepared consequential delivery evidence packets."
config_file = "./agents/sol_reviewer.toml"

[features]
multi_agent = true

[[skills.config]]
path = "./skills/plan-review-ladder/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/delivery-orchestration/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/instruction-learning-loop/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/adversarial-code-review/SKILL.md"
enabled = true
