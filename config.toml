model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "xhigh"

[agents.luna_scanner]
description = "Medium-effort read-only leaf for broad discovery and context-heavy evidence work."
config_file = "./agents/luna_scanner.toml"

[agents.luna_worker]
description = "Luna xhigh workstream worker for routine delivery with bounded delegation through depth 2."
config_file = "./agents/luna_worker.toml"

[agents.luna_fast_worker]
description = "Economical Luna xhigh worker for decided mechanical edits with explicit paths and a deterministic check."
config_file = "./agents/luna_fast_worker.toml"

[agents.sol_fast_worker]
description = "GPT-6.1 Sol low worker for bounded routine implementation on the critical path."
config_file = "./agents/sol_fast_worker.toml"

[agents.sol_worker]
description = "Sol high workstream worker for substantial or difficult implementation with bounded delegation through depth 2."
config_file = "./agents/sol_worker.toml"

[agents.sol_medium_worker]
description = "GPT-6.1 Sol medium terminal worker for bounded work needing stronger judgment."
config_file = "./agents/sol_medium_worker.toml"

[agents.astra_advisor]
description = "Claude-unavailable fallback: Astra high read-only critic for consequential approaches and integrated deliveries; Fable high is preferred."
config_file = "./agents/astra_advisor.toml"

[features]
multi_agent = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 1500000
default_wait_timeout_ms = 1500000
max_wait_timeout_ms = 1500000

[[skills.config]]
path = "./skills/delivery-orchestration/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/skill-loop/SKILL.md"
enabled = true

[[skills.config]]
path = "./skills/adversarial-code-review/SKILL.md"
enabled = true

[plugins."superpowers@openai-curated-remote"]
enabled = false
